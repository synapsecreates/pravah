# FILE: render.yaml
# PURPOSE: 1-Click Zero-Config Free Deployment Blueprint for Pravah (FastAPI Backend + Vite Frontend)
# PROVIDER: Render.com (Free Tier · No Credit Card Required)

services:
  # 1. FastAPI Python Backend Web Service
  - type: web
    name: pravah-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'

  # 2. Vite React Frontend Static Site
  - type: web
    name: pravah-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pravah-backend
          property: host
